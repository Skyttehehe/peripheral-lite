# The desktop app lives in gui/ as its own project (its own Cargo.lock and target/), so this
# root stays a CLI-only project with a single dependency, and deleting gui/ changes nothing here.

[package]
name = "peripheral-lite"
version = "0.5.0"
edition = "2024"
rust-version = "1.88"
description = "Tiny CLI for Logitech HID++ mice and headsets: DPI, report rate, battery, presets. Not affiliated with or endorsed by Logitech."
license = "MIT"
repository = "https://github.com/Skyttehehe/peripheral-lite"
readme = "README.md"
keywords = ["logitech", "hidpp", "mouse", "dpi", "macos"]
categories = ["command-line-utilities", "hardware-support"]

[[bin]]
name = "peripheral-lite"
path = "src/main.rs"

# Windowless `watch` for login autostart; logs to %APPDATA%\peripheral-lite\watch.log.
[[bin]]
name = "peripheral-lite-bg"
path = "src/bin/bg.rs"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Media_Audio",              # waveOut: peripheral-lite's own headset tones
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_System_Console",           # SetStdHandle: background log file
    "Win32_System_Registry",          # autostart Run entry
    "Win32_System_SystemInformation", # GetLocalTime: watch timestamps
    "Win32_System_Diagnostics_ToolHelp", # autostart off: find the running watcher
] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2" # poll, eventfd, netlink, flock, dup2, localtime_r, kill

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2" # poll, pipe, flock, dup2, localtime_r, kill, proc_listallpids (IOKit is linked directly)

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
